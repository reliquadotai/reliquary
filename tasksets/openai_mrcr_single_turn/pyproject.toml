[project]
name = "openai-mrcr-single-turn"
version = "0.1.0"
description = "OpenAI MRCR, conversation as one user turn, hash-gated SequenceMatcher."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.3.1",
    "huggingface-hub",
    "pyarrow",
    "tiktoken>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openai_mrcr_single_turn"]
