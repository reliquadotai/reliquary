[project]
name = "hmmt-feb-2026"
version = "0.1.0"
description = "HMMT February 2026 (single-turn eval, math-verify scoring)."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.3.1",
    "huggingface-hub",
    "pyarrow",
    "math-verify>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hmmt_feb_2026"]
