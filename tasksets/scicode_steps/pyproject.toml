[project]
name = "scicode-steps"
version = "0.1.1"
description = "SciCode (scicode-bench) as one single-turn task per sub-step, chained over the model's own earlier answers."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.3.1",
    "huggingface-hub",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scicode_steps"]
artifacts = ["scicode_steps/data/*.txt", "scicode_steps/verify.py"]
