[project]
name = "graphwalks-single-turn"
version = "0.1.0"
description = "OpenAI GraphWalks, prompt as one user turn, set F1 of the final answer line."
requires-python = ">=3.11"
dependencies = [
    "verifiers>=0.3.1",
    "huggingface-hub",
    "pyarrow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graphwalks_single_turn"]
