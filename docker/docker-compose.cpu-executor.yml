# Zero-secret Code sandbox host. This compose file belongs on cpu-exec-01,
# never on the wallet/control machine.
services:
  reliquary-cpu-executor:
    image: ${CPU_EXECUTOR_IMAGE:?set the verified immutable image ID}
    pull_policy: never
    container_name: reliquary-cpu-executor
    restart: unless-stopped
    stop_grace_period: 30s
    init: true

    # runsc needs the same host-level privileges as the current local grader.
    # This is acceptable only because this dedicated host has no wallet or
    # control credentials. The sandbox, not this container, is the hostile-code
    # boundary.
    privileged: true
    cgroup: host
    ipc: private
    pid: private
    # Host networking avoids Docker's port-forwarding rules bypassing the host
    # firewall. The agent itself must bind only cpu-exec-01's private address.
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=2g
      - /run:rw,nosuid,nodev,size=512m
    pids_limit: ${RELIQUARY_CPU_EXECUTOR_HOST_PIDS_LIMIT:-8192}
    mem_limit: ${RELIQUARY_CPU_EXECUTOR_HOST_MEMORY_LIMIT:-56g}
    cpus: ${RELIQUARY_CPU_EXECUTOR_HOST_CPUS:-7.0}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    env_file: .env.cpu-executor
    volumes:
      - type: bind
        source: ${RELIQUARY_CPU_EXECUTOR_PKI_DIR:-./pki/cpu-executor}
        target: /etc/reliquary/pki
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,os,socket; p=json.load(open('/tmp/reliquary-cpu-executor-health.json')); assert not p['shutdown_complete']; assert p['workers_alive'] == p['pool_size']; s=socket.create_connection((os.environ['RELIQUARY_CPU_EXECUTOR_HOST'],int(os.environ['RELIQUARY_CPU_EXECUTOR_PORT'])),2); s.close()"
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 120s
