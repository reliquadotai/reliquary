# Detached trainer (reliquary train-worker) — runs on the training box.
# No wallet, no HTTP server, no grader sandbox: it only needs a GPU,
# R2 credentials, an HF write token, and (for shadow/cutover starts)
# the bootstrap cursor + revision. See docs/detached-trainer.md.
services:
  reliquary-train-worker:
    image: ${TRAIN_WORKER_IMAGE:-ghcr.io/reliquadotai/reliquary-validator:latest}
    pull_policy: always
    container_name: reliquary-train-worker
    restart: unless-stopped
    stop_grace_period: 60s
    init: true
    # The image's default entrypoint is the VALIDATOR launcher (wallet
    # checks, grader server) — override it entirely: the trainer has no
    # wallet and no grader. TRAIN_WORKER_FLAGS="--shadow" in .env for
    # the pre-cutover phase.
    # RELIQUARY_TRAINER_BACKEND=fsdp2 + RELIQUARY_TRAINER_GPUS=N (both read in
    # the container, from .env) trains on N cards through torchrun; the default
    # single backend runs one process exactly as before, without torchrun.
    entrypoint: ["/bin/bash", "-c", "if [ \"$${RELIQUARY_TRAINER_BACKEND:-single}\" = fsdp2 ]; then exec torchrun --standalone --nproc-per-node=$${RELIQUARY_TRAINER_GPUS:-1} --no-python reliquary train-worker ${TRAIN_WORKER_FLAGS:-}; else exec reliquary train-worker ${TRAIN_WORKER_FLAGS:-}; fi"]
    command: []
    env_file: .env
    environment:
      # Which GPUs the trainer owns on this box (a comma list for fsdp2).
      - CUDA_VISIBLE_DEVICES=${TRAIN_WORKER_GPU:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Resume staging + optimizer snapshots + HF cache.
      - trainer-state:/root/reliquary/trainer
      - hf-cache:/root/.cache/huggingface

volumes:
  trainer-state:
    name: reliquary-trainer-state
  hf-cache:
    name: hf-cache
