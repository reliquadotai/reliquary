# Detached trainer (reliquary train-worker) — runs on the training box.
# No wallet, no HTTP server, no grader sandbox: it only needs a GPU,
# R2 credentials, an HF write token, and (for shadow/cutover starts)
# the bootstrap cursor + revision. See docs/detached-trainer.md.
services:
  reliquary-train-worker:
    image: ghcr.io/reliquadotai/reliquary-validator:latest
    container_name: reliquary-train-worker
    restart: unless-stopped
    stop_grace_period: 60s
    init: true
    command: ["reliquary", "train-worker"]
    # Shadow mode (trains, never publishes):
    #   command: ["reliquary", "train-worker", "--shadow"]
    env_file: .env
    environment:
      # Which GPU the trainer owns on this box.
      - CUDA_VISIBLE_DEVICES=${TRAIN_WORKER_GPU:-0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Resume staging + optimizer snapshots + HF cache.
      - trainer-state:/root/reliquary/trainer
      - hf-cache:/root/.cache/huggingface

volumes:
  trainer-state:
    name: reliquary-trainer-state
  hf-cache:
    name: hf-cache
