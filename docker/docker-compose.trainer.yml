# Trainer validator — no watchtower (sensitive, manual restarts only).
# Mount ONLY the hotkey file + coldkeypub; never mount the coldkey itself.
services:
  reliquary-trainer:
    image: ghcr.io/reliquadotai/reliquary-validator:latest
    container_name: reliquary-trainer
    restart: unless-stopped
    stop_grace_period: 60s
    # Docker's injected init is PID 1 and a Linux child subreaper. This is
    # required for runsc/gofer descendants that outlive a recycled grader
    # worker: without it they reparent to the validator Python process and
    # remain zombies for the lifetime of the container.
    init: true
    # Required for the OpenCodeInstruct grader's gVisor (runsc) sandbox to
    # start: an unprivileged container fails ("cannot create gofer process /
    # cannot create sandbox"). Verified on the prod host — only --privileged
    # worked (seccomp=unconfined + SYS_PTRACE + SYS_ADMIN was not enough).
    # NOTE: Watchtower clones the LIVE container's config, NOT this file, so
    # this only takes effect after a manual `docker compose up -d` here; do
    # that once before the grader image rolls out. Watchtower preserves it
    # afterwards. The miner-code isolation boundary is gVisor, not the
    # container privilege.
    # Local and shadow grader modes remain privileged. Set false only after
    # the remote CPU executor is qualified and MODE=remote is authoritative.
    privileged: ${RELIQUARY_GRADER_PRIVILEGED:-true}
    # runsc needs write access to the host cgroup namespace on cgroup v2
    # hosts. Without this the grader workers can fail at startup with
    # "cannot set up cgroup for root".
    cgroup: ${RELIQUARY_CGROUP_MODE:-host}
    env_file: .env
    environment:
      # Proof slots overlap on one card only through the host's CUDA MPS
      # daemon; without it their CUDA contexts time-slice and four slots
      # measure 8.3 s against 5.7 s. Harmless when the daemon is not running:
      # CUDA falls back to its own contexts. Keep this in step with the bind
      # mount below — the path must be identical on both sides.
      CUDA_MPS_PIPE_DIRECTORY: ${CUDA_MPS_PIPE_DIRECTORY:-/tmp/nvidia-mps}
    # MPS clients reach the server over the pipe directory AND shared memory,
    # so slots need the host IPC namespace as well as the bind below. This is
    # NVIDIA's documented container recipe; the bind alone is not enough, and
    # neither failure is reported by CUDA — confirm with the 1-slot vs N-slot
    # timing, not by the container starting.
    #
    # OPT-IN, and deliberately not the default: it hands the host's SysV IPC
    # and /dev/shm to a container that runs untrusted submissions. gVisor, not
    # the IPC namespace, is the boundary for miner code — but a one-slot
    # deployment gains nothing here, so it should not pay for it either.
    # Set RELIQUARY_IPC_MODE=host in docker/.env when running proof slots.
    ipc: ${RELIQUARY_IPC_MODE:-private}
    # NVIDIA Container Toolkit required on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${RELIQUARY_HTTP_PORT:-8080}:8080"
    volumes:
      # Validator signing credentials (readonly)
      - type: bind
        source: ${BT_WALLETS_DIR:?set BT_WALLETS_DIR to the host path of your wallets/}
        target: ${BT_WALLET_PATH:-/opt/reliquary/wallets}
        read_only: true
      # Remote CPU-executor client identity. Empty/missing files are harmless
      # while local runsc remains selected.
      - type: bind
        source: ${RELIQUARY_GRADER_CLIENT_PKI_DIR:-./pki/grader-client}
        target: /etc/reliquary/grader-client-pki
        read_only: true
      # CUDA MPS control pipe, created on the host by nvidia-cuda-mps-control.
      # create_host_path keeps the container startable on a box with no MPS.
      - type: bind
        source: ${CUDA_MPS_PIPE_DIRECTORY:-/tmp/nvidia-mps}
        target: ${CUDA_MPS_PIPE_DIRECTORY:-/tmp/nvidia-mps}
        bind:
          create_host_path: true
      # Persistent state (staging checkpoints, HF cache)
      - reliquary-state:/root/reliquary/state
      - hf-cache:/root/.cache/huggingface

volumes:
  reliquary-state:
    name: reliquary-state
  hf-cache:
    name: hf-cache
