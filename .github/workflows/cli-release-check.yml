name: CLI package checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installed-client:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Build wheel and source distribution outside checkout
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/cli-dist"
      - name: Check non-editable wheel and source installs
        shell: bash
        run: |
          for artifact in "$RUNNER_TEMP/cli-dist/"*.whl "$RUNNER_TEMP/cli-dist/"*.tar.gz; do
            runtime="$RUNNER_TEMP/cli-runtime"
            python -m venv --clear "$runtime"
            "$runtime/bin/python" -m pip install "$artifact"
            cd "$RUNNER_TEMP"
            env -u PYTHONPATH "$runtime/bin/python" "$GITHUB_WORKSPACE/scripts/check_cli_package.py"
          done
      - name: Retain candidate packages
        uses: actions/upload-artifact@v4
        with:
          name: cli-package-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/cli-dist/*
          if-no-files-found: error
          retention-days: 7
