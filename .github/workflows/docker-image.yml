name: Build and publish validator image

on:
  push:
    branches: [main]
    # Main builds publish revision tags. Promoting latest is a separate action.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      promote_latest:
        description: "Also publish latest from main after deployment review"
        type: boolean
        default: false
      include_logic:
        description: "Build the explicitly qualified Logic candidate variant (separate -logic tag)"
        type: boolean
        default: false

# Serialize builds and cancel superseded work. Main pushes publish only
# revision tags; updating latest requires an explicit dispatch from main.
concurrency:
  group: docker-image-build
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      # GitHub-hosted ubuntu-latest only has ~14 GB free at start. The
      # CUDA+PyTorch base image plus the gha build cache (mode=max) blow
      # past that and the runner dies with "No space left on device" mid
      # build. Free ~30 GB by removing preinstalled tooling we never use
      # (Android SDK, .NET, Haskell, large apt packages, the hostedtoolcache).
      # Cost: ~1 min, much cheaper than a paid larger runner.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false   # we need docker for the build itself
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Read the reviewed Logic release source
        if: inputs.include_logic
        id: logic
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          pin = json.loads(Path('docker/logic-release.json').read_text())
          print('source_commit=' + pin['source_commit'])
          print('wheel=' + pin['wheel'])
          PY
      - uses: actions/checkout@v4
        if: inputs.include_logic
        with:
          repository: reliquadotai/reliquary-environments
          ref: ${{ steps.logic.outputs.source_commit }}
          path: .logic-source
      - uses: astral-sh/setup-uv@v7
        if: inputs.include_logic
        with:
          version: "0.11.10"
          python-version: "3.12"
      - name: Build reviewed candidate wheel twice
        if: inputs.include_logic
        working-directory: .logic-source
        run: uv run --no-project --python 3.12 python scripts/build_logic_release.py --output "${{ runner.temp }}/logic-release"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # These tags are fully determined by the event. Derive them locally
      # instead of asking the GitHub API through docker/metadata-action: an API
      # outage must not prevent us from building an otherwise releasable image.
      - name: Resolve image tags
        id: image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/reliquary-validator
          PROMOTE_LATEST: ${{ inputs.promote_latest || false }}
          INCLUDE_LOGIC: ${{ inputs.include_logic || false }}
        run: |
          if [[ "$INCLUDE_LOGIC" == "true" && "$PROMOTE_LATEST" == "true" ]]; then
            echo "Logic candidate cannot promote latest in this workflow" >&2
            exit 1
          fi
          {
            echo "tags<<EOF"
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && \
                  "$GITHUB_REF" == "refs/heads/main" && \
                  "$PROMOTE_LATEST" == "true" ]]; then
              echo "$IMAGE:latest"
            fi
            if [[ "$INCLUDE_LOGIC" == "true" ]]; then
              echo "$IMAGE:sha-${GITHUB_SHA::7}-logic"
            else
              echo "$IMAGE:sha-${GITHUB_SHA::7}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            RELIQUARY_BUILD_REVISION=${{ github.sha }}
            RELIQUARY_INSTALL_LOGIC=${{ inputs.include_logic && '1' || '0' }}
          secret-files: |
            ${{ inputs.include_logic && format('logic_wheel={0}/logic-release/{1}', runner.temp, steps.logic.outputs.wheel) || '' }}
          cache-from: type=gha
          # The optional CUDA+Logic variant already publishes its image to
          # GHCR. Exporting its multi-GB cache delayed the candidate job long
          # after that push completed; leave normal main caching unchanged.
          cache-to: ${{ !inputs.include_logic && 'type=gha,mode=max' || '' }}
