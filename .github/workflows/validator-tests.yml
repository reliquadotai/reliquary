name: Validator tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validator-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    runs-on: ubuntu-24.04
    # Allow setup and authenticity checks beside the full CPU suite.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Run validator suite
        run: |
          pytest -q \
            --ignore=tests/gpu \
            --ignore=tests/integration/test_grader_e2e.py
      - name: Check V5 authenticity boundaries
        env:
          RELIQUARY_PROTOCOL_PROFILE: qwen3-4b-base-dapo-reasoning-v5
          RELIQUARY_EXPERIMENTAL_FILL_CLOSED_ENABLED: "0"
        run: |
          pytest -q tests/unit/test_grpo_window_batcher.py \
            -k 'all_token_auth or forced_seed_group_gate or forced_seed_gate_abstains or forced_seed_cdf_gate or forged or tamper'

  cpu-suite:
    runs-on: ubuntu-24.04
    needs: [cpu-tests, signed-sandbox-cpu]
    if: always()
    steps:
      - name: Require all CPU suites
        env:
          CPU_RESULT: ${{ needs.cpu-tests.result }}
          SANDBOX_RESULT: ${{ needs.signed-sandbox-cpu.result }}
        run: test "$CPU_RESULT" = success && test "$SANDBOX_RESULT" = success

  signed-sandbox-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      SIGNED_SANDBOX_MODULES: >-
        test_agentic_swe_signed test_bridged_episode test_bridged_swe
        test_corpus_export_signed test_corpus_job_signed_sandbox test_corpus_multi_job_contract
        test_corpus_period_settlement test_corpus_quota test_corpus_settlement
        test_rl_capacity test_rl_capacity_attacks test_rl_check_cap
        test_rl_engagements test_rl_episode_e2e test_rl_episode_miner_side
        test_rl_episode_routes test_rl_episode_wiring test_rl_options_and_boot
        test_rl_pay test_rl_prompt_ranges test_rl_quota
        test_rl_quota_wiring test_rl_saturation test_rl_session_events
        test_rl_yield test_rl_yield_wiring test_sandbox_dependency
        test_sandbox_directory test_sandbox_fleet test_sandbox_routes
        test_sandbox_sessions test_signed_episode_e2e test_signed_episode_environment
        test_signed_grading_and_wiring test_signed_intake test_signed_miner
        test_signed_parse test_signed_state test_signed_wire
        test_tasks_create_composed test_admin_eval_sandbox test_evaluation_sessions
        test_eval_signed_agentic test_eval_signed_policy test_eval_signed_limits test_eval_model_wire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
          cache: pip
      - name: Install pinned sandbox test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,sandbox-test,sandbox-miner]"
      - name: Require the signed sandbox dependencies and exact source pin
        run: |
          python - <<'PY'
          import importlib
          from reliquary.sandbox import SANDBOX_COMMIT, sandbox_commit_refusal
          for module in (
              "bittensor", "renderers", "verifiers.v1.clients.train",
              "verifiers.v1.harnesses.bash.harness", "reliquary_sandbox.attest",
              "reliquary_sandbox.observation", "reliquary_sandbox_verifiers.task",
              "reliquary_sandbox_verifiers.runner",
              "reliquary_sandbox_service.episodes.testing",
              "reliquary_sandbox_service.episodes.state_archive",
          ):
              importlib.import_module(module)
          refusal = sandbox_commit_refusal(SANDBOX_COMMIT)
          assert refusal is None, refusal
          print("Installed sandbox source:", SANDBOX_COMMIT)
          PY
      - name: Run signed sandbox CPU tests
        id: signed_tests
        run: |
          paths=()
          for module in $SIGNED_SANDBOX_MODULES; do
            paths+=("tests/unit/$module.py")
          done
          pytest -q "${paths[@]}" \
            --junitxml="$RUNNER_TEMP/signed-sandbox.xml" \
            -o junit_logging=no -o junit_log_passing_tests=false
      - name: Check every required module ran and write a safe summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.signed_tests.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path(os.environ["RUNNER_TEMP"]) / "signed-sandbox.xml"
          try:
              cases = list(ET.parse(report).iter("testcase"))
          except (FileNotFoundError, ET.ParseError):
              cases = []
          required = {f"tests.unit.{name}" for name in os.environ["SIGNED_SANDBOX_MODULES"].split()}
          exercised = {case.get("classname") for case in cases if case.find("skipped") is None}
          missing = required - exercised
          failed = sum(case.find("failure") is not None for case in cases)
          errors = sum(case.find("error") is not None for case in cases)
          skipped = sum(case.find("skipped") is not None for case in cases)
          passed = sum(not any(case.find(tag) is not None for tag in ("failure", "error", "skipped"))
                       for case in cases)
          succeeded = os.environ["TEST_OUTCOME"] == "success"
          summary = {
              "status": "passed" if succeeded and not (missing or failed or errors) else "failed",
              "revision": os.environ["GITHUB_SHA"],
              "tests": len(cases), "passed": passed,
              "failed": failed, "errors": errors, "skipped": skipped,
              "modules_expected": len(required), "modules_exercised": len(required & exercised),
          }
          target = Path("test-results/signed-sandbox-summary.json")
          target.parent.mkdir(exist_ok=True)
          target.write_text(json.dumps(summary, sort_keys=True) + "\n")
          assert not missing, "A required signed-sandbox module ran no tests"
          assert failed == errors == 0, "Signed-sandbox tests failed"
          assert succeeded, "Signed-sandbox test execution did not succeed"
          PY
      - name: Upload signed sandbox test counts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-sandbox-test-summary
          path: test-results/signed-sandbox-summary.json
          if-no-files-found: error
          retention-days: 7

  # The suite above runs at DEFAULT_PROFILE_ID, which is still v2, so it
  # exercises the fill-closed code with B_BATCH=8 and M_ROLLOUTS=8. This job
  # runs the same fill-closed tests at the shape production will actually
  # deploy: B_BATCH=16, 256 target groups, 512 admission budget.
  #
  # `classic_window` is deselected on purpose. Those tests assert the pre-v6
  # timed window — flat slot_share payment, no EOS accounting — which the v6
  # profile answers differently by design. They stay covered by cpu-suite.
  fill-closed-v6:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [qwen3-4b-base-dapo-fill-closed-v6, qwen3-4b-base-dapo-reliquary-v1]
    env:
      RELIQUARY_PROTOCOL_PROFILE: ${{ matrix.profile }}
      RELIQUARY_EXPERIMENTAL_FILL_CLOSED_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Assert the profile actually resolved
        run: |
          python - <<'PY'
          import reliquary.constants as c
          assert c.PROTOCOL_VERSION == 6, c.PROTOCOL_VERSION
          assert c.FILL_CLOSED_ENABLED is True
          assert (c.B_BATCH, c.M_ROLLOUTS) == (16, 16), (c.B_BATCH, c.M_ROLLOUTS)
          assert c.FILL_CLOSED_TARGET_GROUPS_PER_ENV == 256
          print("v6 profile resolved:", c.PROTOCOL_PROFILE_ID)
          PY
      - name: Run the fill-closed suite under the v6 profile
        run: |
          pytest -q -m "not classic_window" \
            tests/unit/test_v6_emission.py \
            tests/unit/test_v6_seal_seam.py \
            tests/unit/test_fill_close_and_emit.py \
            tests/unit/test_fill_closed_batch_assembler.py \
            tests/unit/test_fill_closed_profile.py \
            tests/unit/test_fill_closed_rotation.py \
            tests/unit/test_bounded_fill_service.py \
            tests/unit/test_trainer_macro_boundary.py \
            tests/unit/test_prove_on_arrival.py \
            tests/unit/test_pick_by_rate.py \
            tests/unit/test_pick_pacing.py \
            tests/unit/test_rate_ordered_admission.py \
            tests/unit/test_remote_cpu_executor.py \
            tests/unit/test_all_token_auth_enforce.py \
            tests/unit/test_prepare_v5_fill_checkpoint.py \
            tests/unit/test_semantic_signer.py \
            tests/unit/test_checkpoint_store.py \
            tests/unit/test_weight_only_validator.py \
            tests/unit/test_v1_bootstrap.py \
            tests/unit/test_v1_cutover.py \
            tests/unit/test_trainer_publication_recovery.py \
            tests/unit/test_remote_proof_controller.py \
            tests/unit/test_seed_pool.py \
            tests/unit/test_public_pool_sampling.py \
            tests/unit/test_service_policy_admission.py \
            tests/unit/test_service_checkpoint_adoption.py \
            tests/integration/test_remote_proof_mtls.py
      - name: Check inherited V5 authenticity boundaries
        run: |
          pytest -q tests/unit/test_grpo_window_batcher.py \
            -k 'all_token_auth or forced_seed_group_gate or forced_seed_gate_abstains or forced_seed_cdf_gate or forged or tamper'
