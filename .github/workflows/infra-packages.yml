name: Infrastructure packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        role: [cpu_executor, signer]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the exact committed role and verify portable evidence
        env:
          ROLE: ${{ matrix.role }}
        run: |
          ./scripts/build_${ROLE}_artifact.sh artifact "$(git rev-parse HEAD)"
          mv artifact "$RUNNER_TEMP/reliquary-${ROLE}"
          ./scripts/verify_${ROLE}_artifact.sh "$RUNNER_TEMP/reliquary-${ROLE}"
          printf '\ntampered\n' >> "$RUNNER_TEMP/reliquary-${ROLE}/python-packages.txt"
          if ./scripts/verify_${ROLE}_artifact.sh "$RUNNER_TEMP/reliquary-${ROLE}"; then
            echo "Verifier accepted altered evidence" >&2
            exit 1
          fi
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish current role image
        if: github.event_name == 'push'
        env:
          ROLE: ${{ matrix.role }}
          OWNER: ${{ github.repository_owner }}
        run: |
          NAME="reliquary-${ROLE//_/-}"
          IMAGE="ghcr.io/$OWNER/$NAME"
          docker tag "$NAME:$GITHUB_SHA" "$IMAGE:sha-${GITHUB_SHA::7}"
          docker tag "$NAME:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
