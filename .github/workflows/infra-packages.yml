name: Infrastructure packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        role: [cpu_executor, signer]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the exact committed role and verify portable evidence
        env:
          ROLE: ${{ matrix.role }}
        run: |
          ./scripts/build_${ROLE}_artifact.sh artifact "$(git rev-parse HEAD)"
          mv artifact "$RUNNER_TEMP/reliquary-${ROLE}"
          ./scripts/verify_${ROLE}_artifact.sh "$RUNNER_TEMP/reliquary-${ROLE}"
          printf '\ntampered\n' >> "$RUNNER_TEMP/reliquary-${ROLE}/python-packages.txt"
          if ./scripts/verify_${ROLE}_artifact.sh "$RUNNER_TEMP/reliquary-${ROLE}"; then
            echo "Verifier accepted altered evidence" >&2
            exit 1
          fi
