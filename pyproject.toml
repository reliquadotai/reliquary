[project]
name = "reliquary"
version = "0.1.0"
description = "Reliquary — Verifiable Inference Subnet"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "torch>=2.13.0",
    "numpy>=1.20.0",
    # Pinned exact: apply_chat_template output (encode_prompt) must be
    # byte-identical across all validators and miners, or PROMPT_MISMATCH
    # rejects honest miners. Bump only after the frozen encodings in
    # tests/unit/test_tokens.py still pass.
    "transformers==5.10.4",
    "safetensors>=0.3.0",
    # NetUid is a SCALE newtype in the current Subtensor runtime. Keep the
    # client and codec stack pinned together so runtime API calls encode it
    # correctly and image rebuilds cannot silently change chain behavior.
    "bittensor==10.5.0",
    "async-substrate-interface==2.2.1",
    "cyscale==0.5.0",
    "pydantic>=2.3,<3.0.0",
    "requests>=2.28.0",
    "httpx>=0.25.0",
    # Bounded: the proof worker reads the Hub commit list through
    # huggingface_hub private internals (utils._pagination.paginate,
    # HfApi._build_hf_headers). The logic runtime locks 1.30.0; the evaluation
    # runner pins 1.31.0. Keep both reviewed minor versions supported.
    "huggingface-hub>=1.30,<1.32",
    "datasets>=2.14.0",
    "aiobotocore>=2.0.0",
    "boto3>=1.24.0",
    "botocore>=1.24.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tenacity>=8.0.0",
    "pyarrow>=14.0.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.52,<0.53",
    "bitsandbytes>=0.43.0",
    # The agentic harness miners and validators share (render, parse, loop): one commit
    # of reliquary-sandbox's harness/ distribution. `agentic_swe.HARNESS_DIGEST` pins
    # the spec it must install; another digest refuses SWE and signed jobs.
    "reliquary-harness[qwen] @ git+https://github.com/reliquadotai/reliquary-sandbox.git@d680d5e6f694c650f74b9dea4bc62930aad45da0#subdirectory=harness",
]

[project.optional-dependencies]
vision = [
    "torch==2.13.0",
    "peft==0.21.2",
    "accelerate==1.15.0",
    "Pillow==13.0.0",
    "torchvision==0.22.0",
    "num2words==0.5.14",
]
dev = [
    "Pillow==13.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
]
wandb = [
    "wandb>=0.16",
]
# Signed-episode sandboxes (plan 3): reliquary-sandbox, public, pinned by one commit.
sandbox = [
    "reliquary-sandbox[verifiers] @ git+https://github.com/reliquadotai/reliquary-sandbox.git@d680d5e6f694c650f74b9dea4bc62930aad45da0",
]
sandbox-miner = [
    "reliquary-sandbox[verifiers] @ git+https://github.com/reliquadotai/reliquary-sandbox.git@d680d5e6f694c650f74b9dea4bc62930aad45da0",
    "reliquary[miner-envs]",
]
# The env packages agentic orders pin (reliquary/miner/env_packages.py: the same list), from git so
# pip records the commit the validator checks. Built for Python 3.12 only, like the gateways.
# pip keeps a git install whose commit moved under the same version: `reliquary miner-envs --sync`
# (run by the miner at start) reinstalls those.
miner-envs = [
    "reliquary-swe @ git+https://github.com/reliquadotai/reliquary-environments.git@15ad131b473f59f46b62d363bfacf430f4931f39#subdirectory=environments/code/reliquary_swe ; python_version == '3.12'",
    "reliquary-swebench-pro @ git+https://github.com/reliquadotai/reliquary-environments.git@d2cf12b1c144515397fae634f5e848f7df55c180#subdirectory=environments/code/reliquary_swebench_pro ; python_version == '3.12'",
    "reliquary-deepswe @ git+https://github.com/reliquadotai/reliquary-environments.git@faaefd675e6f6583e6e1ce3f3a3eca109fe8e766#subdirectory=environments/code/reliquary_deepswe ; python_version == '3.12'",
    "reliquary-terminal-bench @ git+https://github.com/reliquadotai/reliquary-environments.git@a7718445c156a36eec2835c43d5fb6c86c045a5e#subdirectory=environments/code/reliquary_terminal_bench ; python_version == '3.12'",
    "reliquary-automationbench @ git+https://github.com/reliquadotai/reliquary-environments.git@b404a0bb93b289a44ae242c001148f21982812a7#subdirectory=environments/tool_use/reliquary_automationbench ; python_version == '3.12'",
]
sandbox-test = [
    "reliquary-sandbox[service] @ git+https://github.com/reliquadotai/reliquary-sandbox.git@d680d5e6f694c650f74b9dea4bc62930aad45da0",
]

[project.scripts]
reliquary = "reliquary.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel.force-include]
# The historical manifest binds this exact path relative to the installed package root.
"tests/fixtures/reliquarylogic_v1.jsonl" = "tests/fixtures/reliquarylogic_v1.jsonl"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Stated, not left to the plugin: pytest-asyncio warns when it is unset, and warnings are errors here.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "classic_window: asserts the pre-v6 timed-window behaviour. These pass under the default profile and are deselected by the v6 job, where the product answers differently by design.",
]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    "error::FutureWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    # Starlette 1.6 imports this compatibility alias from AnyIO 4.15.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated, use anyio.from_thread.BlockingPortal instead.:DeprecationWarning",
    "ignore:Deprecated in 0.9.0. BPE.__init__ will not create from files anymore",
]
